<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 512px; height: 512px; overflow: hidden; background: #020617; }
    svg { width: 512px; height: 512px; display: block; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Obsidian Background -->
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Cyber Ribbon Gradient -->
    <linearGradient id="neonRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="36" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bg3)" />

  <!-- Radial Cyber Aura -->
  <circle cx="256" cy="256" r="160" fill="#6366F1" opacity="0.18" filter="blur(60px)" />
  <circle cx="340" cy="200" r="120" fill="#06B6D4" opacity="0.2" filter="blur(50px)" />

  <!-- Concentric subtle tech ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Main AI Agent Check & Loop -->
  <g filter="url(#shadow3)">
    <!-- Checkmark & Infinity Curve -->
    <path d="M 120 270 C 145 230, 180 230, 205 270 L 225 300 C 235 315, 255 315, 265 300 L 375 145 C 390 125, 415 130, 420 155 C 428 195, 395 240, 345 285 L 295 330 C 265 355, 220 350, 195 320 L 120 270 Z" 
          fill="url(#neonRibbon)" 
          filter="url(#neonGlow3)" />

    <!-- Pure White Central Laser Check Core -->
    <path d="M 145 265 L 235 345 C 243 353, 257 353, 265 345 L 380 185" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3 Autonomous Agent Energy Nodes -->
    <circle cx="380" cy="185" r="14" fill="#67E8F9" filter="url(#neonGlow3)" />
    <circle cx="380" cy="185" r="7" fill="#FFFFFF" />

    <circle cx="235" cy="345" r="10" fill="#10B981" filter="url(#neonGlow3)" />
    <circle cx="145" cy="265" r="10" fill="#06B6D4" filter="url(#neonGlow3)" />

    <!-- AI Spark Top-Right -->
    <path d="M 390 90 Q 390 120 420 120 Q 390 120 390 150 Q 390 120 360 120 Q 390 120 390 90 Z" 
          fill="#EC4899" 
          filter="url(#neonGlow3)" />
  </g>
</svg>
</body>
</html>
