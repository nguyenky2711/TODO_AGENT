<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Cyber Ribbon Gradient -->
    <linearGradient id="neonRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Full Unbounded Glow Filter -->
    <filter id="neonGlowTransparent" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="symbolShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Main AI Agent Check & Infinity Loop (100% Transparent Background) -->
  <g transform="translate(15, 20)" filter="url(#symbolShadow)">
    <!-- Cyberpunk Ambient Loop Ribbon -->
    <path d="M 105 270 C 130 230, 168 230, 192 270 L 214 300 C 224 315, 246 315, 256 300 L 372 145 C 388 125, 414 130, 418 155 C 426 195, 392 240, 342 285 L 290 330 C 258 355, 212 350, 185 320 L 105 270 Z" 
          fill="url(#neonRibbon)" 
          filter="url(#neonGlowTransparent)" />

    <!-- Pure White Central Laser Check Core -->
    <path d="M 132 265 L 226 345 C 234 353, 248 353, 256 345 L 378 185" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3 Autonomous Agent Energy Nodes -->
    <circle cx="378" cy="185" r="15" fill="#67E8F9" filter="url(#neonGlowTransparent)" />
    <circle cx="378" cy="185" r="7" fill="#FFFFFF" />

    <circle cx="226" cy="345" r="12" fill="#10B981" filter="url(#neonGlowTransparent)" />
    <circle cx="226" cy="345" r="5" fill="#FFFFFF" />

    <circle cx="132" cy="265" r="12" fill="#06B6D4" filter="url(#neonGlowTransparent)" />
    <circle cx="132" cy="265" r="5" fill="#FFFFFF" />

    <!-- AI Spark Top-Right (Apex Glow) -->
    <path d="M 390 85 Q 390 120 425 120 Q 390 120 390 155 Q 390 120 355 120 Q 390 120 390 85 Z" 
          fill="#EC4899" 
          filter="url(#neonGlowTransparent)" />
    <circle cx="390" cy="120" r="4" fill="#FFFFFF" />
  </g>
</svg>
